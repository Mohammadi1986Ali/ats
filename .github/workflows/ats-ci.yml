name: ATS checks
on:
  push:
    branches: [main, feature/ats-pipeline]
  pull_request:
    branches: [main]

concurrency:
  group: ats-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_DB: job_hire_ai
          POSTGRES_USER: ats
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ats -d job_hire_ai"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --frozen --group dev --python 3.12
      - name: Lint
        run: uv run --python 3.12 ruff check .
      - name: Run SQLite regression suite (no Ollama required)
        run: uv run --python 3.12 pytest -q -m 'not live_ollama'
      - name: Install optional PostgreSQL driver
        run: uv pip install --python .venv -r requirements-postgres.txt
      - name: Apply Alembic schema to real PostgreSQL
        env:
          ATS_DATABASE_URL_OVERRIDE: postgresql+psycopg://ats:ci-test-password@127.0.0.1:5433/job_hire_ai
        run: uv run --no-sync alembic upgrade head
      - name: Verify SQLite to PostgreSQL copy
        env:
          ATS_TEST_POSTGRES_URL: postgresql+psycopg://ats:ci-test-password@127.0.0.1:5433/job_hire_ai
        run: uv run --no-sync pytest -q tests/integration/test_postgres_live_phase31.py
