services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: job_hire_ai
      POSTGRES_USER: ats
      POSTGRES_PASSWORD: ${ATS_POSTGRES_PASSWORD:?Set ATS_POSTGRES_PASSWORD before running Docker Compose}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ats_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats -d job_hire_ai"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  ats_postgres_data:
